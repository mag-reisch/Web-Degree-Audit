<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mock Degree Audit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css"> 
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to requirements</a> 
    <div id="error"></div>
    
    <header class="app-header" id="app-header">
      <div id="header"></div>
      <div class="header-controls">
        <div id="header-summary"></div>
        <div id="mode-controls">
          <label><input id="plan-mode" type="checkbox"> Plan Mode: <span 
            id="plan-mode-status" aria-hidden="true">Off</span></label>
        </div>
      </div>
    </header>
    
    <main id="main" class="content" tabindex="-1">
      <div id="progress"></div>
      <br>
      <label for="course-search">Search courses</label>
      <input id="course-search" type="search" placeholder="e.g. CS 410 or Algorithms">
      <p id="search-results" role="status"></p>
      <div id="requirements"></div>
    </main>
    <script src="header.js"></script> 
    <script src="script.js"></script>
  </body>
</html>
